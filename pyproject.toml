# Python packaging for agri-rf-forecasting.
#
#   pip install "git+https://github.com/lunganlungpg/agri-rf-forecasting.git"
#   import agrirf            # or run `agri-rf --help`
#
# The source lives in ./python and is installed under the import name `agrirf`
# (see [tool.setuptools.package-dir] below), so the existing scripts keep working.

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-rf-forecasting"
version = "1.0.0"
description = "Random Forest regression for agricultural yield and time-series forecasting"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lunganlung P. G." }]
keywords = ["agriculture", "random-forest", "forecasting", "crop-yield", "time-series"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime dependencies (requirements.txt also lists notebook extras).
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.15",
]

[project.scripts]
agri-rf = "agrirf.cli:main"

[project.urls]
Homepage = "https://github.com/lunganlungpg/agri-rf-forecasting"
Source = "https://github.com/lunganlungpg/agri-rf-forecasting"

[tool.setuptools]
packages = ["agrirf"]

[tool.setuptools.package-dir]
agrirf = "python"
